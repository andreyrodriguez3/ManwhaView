<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ManwhaView</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>📚 ManwhaView</h1>
  <div class="tools">
    <input id="search" type="search" placeholder="Buscar…">
    <select id="filter">
      <option value="">Todos</option>
      <option>Leyendo</option>
      <option>Pendiente</option>
      <option>Completado</option>
      <option>Abandonado</option>
    </select>
    <button id="add">+ Añadir</button>
    <button id="export" title="Descargar copia de seguridad">⬇</button>
    <label class="btn" title="Importar copia">⬆<input id="import" type="file" accept=".json" hidden></label>
  </div>
</header>
<main id="grid"></main>

<dialog id="form-dlg">
  <form id="form" method="dialog">
    <h2 id="form-title">Manhwa</h2>
    <label>Título <input name="title" required></label>
    <label>Portada (URL) <input name="cover" type="url"></label>
    <label>Estado
      <select name="status"><option>Leyendo</option><option>Pendiente</option><option>Completado</option><option>Abandonado</option></select>
    </label>
    <label>Capítulo actual <input name="chapter" type="number" min="0" value="0"></label>
    <label>Total de capítulos <input name="total" type="number" min="0" placeholder="opcional"></label>
    <label>Puntuación (0-10) <input name="rating" type="number" min="0" max="10" step="0.5"></label>
    <label>Enlace de lectura <input name="url" type="url"></label>
    <label>Notas <textarea name="notes" rows="3"></textarea></label>
    <menu>
      <button value="cancel" formnovalidate>Cancelar</button>
      <button id="save" value="ok">Guardar</button>
    </menu>
  </form>
</dialog>

<dialog id="reader-dlg" class="reader">
  <div class="reader-bar">
    <strong id="reader-title"></strong>
    <button id="reader-close">✕</button>
  </div>
  <p class="hint">Pega URLs de imágenes del capítulo (una por línea) y pulsa Cargar.</p>
  <textarea id="reader-urls" rows="3"></textarea>
  <button id="reader-load">Cargar</button>
  <div id="pages"></div>
</dialog>
<script src="app.js"></script>
</body>
</html>
